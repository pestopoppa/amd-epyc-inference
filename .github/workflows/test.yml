name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Create CI workspace dirs
        run: mkdir -p .ci-tmp/models .ci-tmp/cache .ci-tmp/tmp logs/canvases

      - name: Run linter
        run: ruff check src/ tests/

      - name: Check for hardcoded paths
        run: |
          # Check that no NEW hardcoded /mnt/raid0 paths are added (fallbacks are allowed)
          # Current count: 32 occurrences — env fallbacks, validation patterns,
          # LLM instruction strings (prompt_builders/constants.py, graph/nodes.py),
          # sentinel/tap file paths, and tool defaults.
          COUNT=$(grep -r "/mnt/raid0" src/ --include="*.py" 2>/dev/null | wc -l || echo "0")
          echo "Found $COUNT occurrences of /mnt/raid0 in src/"
          if [ "$COUNT" -gt 32 ]; then
            echo "ERROR: New hardcoded paths detected! Use get_config().paths.* instead."
            echo "Allowed: fallback defaults in _get_*() helper functions and LLM instruction strings"
            grep -rn "/mnt/raid0" src/ --include="*.py" || true
            exit 1
          fi
          echo "✓ Path check passed (only fallback defaults found)"

      - name: Run tests with coverage
        run: pytest tests/ -x --timeout=120 -q --cov=src --cov-report=term-missing --cov-fail-under=30
        env:
          ORCHESTRATOR_MOCK_MODE: "true"
          # Redirect /mnt/raid0 paths to CI-safe locations
          ORCHESTRATOR_PATHS_LLM_ROOT: ${{ github.workspace }}/.ci-tmp
          ORCHESTRATOR_PATHS_PROJECT_ROOT: ${{ github.workspace }}
          ORCHESTRATOR_PATHS_TMP_DIR: ${{ runner.temp }}

      - name: Type check
        run: mypy src/ --ignore-missing-imports --no-error-summary || true
        # Note: mypy runs in advisory mode (|| true) until type annotations are complete.
        # Remove "|| true" once mypy passes cleanly to enforce type checking.
